name: validate

# Credential-free checks on every PR/push: Terraform fmt + validate for all
# roots, kustomize build, PowerShell parse, bash -n (blocking) and shellcheck
# (advisory) for the Equinix-side scripts, and a secret scan. Nothing here
# touches a cloud.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/azure
          - terraform/aws
          - terraform/equinix
          - terraform/environments/demo
          - terraform/bootstrap/azure
          - terraform/bootstrap/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: fmt
        working-directory: ${{ matrix.root }}
        run: terraform fmt -check -recursive -diff
      - name: init (no backend, no credentials)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml
      - name: kustomize build (base)
        run: kubectl kustomize kubernetes/base > /dev/null
      - name: parse every manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob("kubernetes/**/*.yaml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"::error file={f}::{e}"); bad += 1
          sys.exit(bad)
          PY

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            if ($e) { Write-Host "::error file=$($_.FullName)::$($e[0].Message)"; $failed++ }
          }
          exit $failed
      - name: bash syntax (Equinix-side scripts)
        run: for f in equinix/k3s/*.sh; do bash -n "$f"; done
      - name: shellcheck (advisory)
        run: shellcheck -S warning equinix/k3s/*.sh || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan tracked files
        run: |
          set -euo pipefail
          patterns=(
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'AIza[0-9A-Za-z_-]{35}'
            'ya29\.[0-9A-Za-z_-]+'
            'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
            'AccountKey=[A-Za-z0-9+/=]{40,}'
          )
          hits=0
          for f in $(git ls-files); do
            for p in "${patterns[@]}"; do
              if grep -E -q -- "$p" "$f" 2>/dev/null; then echo "::error file=$f::possible secret ($p)"; hits=$((hits+1)); fi
            done
          done
          exit $hits
